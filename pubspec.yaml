name: app_temp
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.7.3
  hugeicons:
    hosted: https://onepub.dev/api/kdpxxpsdav/
    version: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: SomarSans
      fonts:
        - asset: assets/fonts/SomarSans-Regular.otf
          weight: 400
        - asset: assets/fonts/SomarSans-Medium.otf
          weight: 500
        - asset: assets/fonts/SomarSans-SemiBold.otf
          weight: 600
        - asset: assets/fonts/SomarSans-Bold.otf
          weight: 700
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri-Variable.ttf
